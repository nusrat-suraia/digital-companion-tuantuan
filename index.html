<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>数字人团团 · 生存汉语学习伙伴</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div class="app">
        <header>
            <h1>🐼 数字人团团 · 生存汉语伙伴</h1>
            <div class="status">
                <i class="fas fa-microphone"></i> 语音就绪
            </div>
        </header>

        <div class="panda-stage">
            <canvas id="pandaCanvas"></canvas>
            <div class="speech-bubble" id="speechBubble">
                <span id="pandaSpeech">你好！我是团团，你的中文学习伙伴～</span>
            </div>
        </div>

        <div class="chat-area">
            <div class="scene-info" id="sceneInfo">
                📍 当前场景：<span id="currentSceneName">签证 · 机场</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="bubble">你好！我是团团，我来陪你练习生存汉语～</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="说出或输入你的回答...">
                <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                <button id="speechBtn"><i class="fas fa-microphone"></i></button>
            </div>
        </div>

        <footer>
            <p>🎤 语音对话 | 发音纠正 | 真实场景练习 🎤</p>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
