<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人团团 · 演示视频</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div class="demo-container">
        <div class="panda-stage">
            <canvas id="pandaCanvas"></canvas>
            <div class="speech-bubble" id="speechBubble">
                <span id="pandaSpeech">你好！我是团团～</span>
            </div>
        </div>
        <div class="subtitle-area">
            <div class="scene-title" id="sceneTitle">签证 · 机场场景</div>
            <div class="user-response" id="userResponse"></div>
            <div class="correction-hint" id="correctionHint"></div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
